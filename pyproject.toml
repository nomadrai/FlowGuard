[project]
name = "flowguard"
version = "1.0.0"
description = "Physics-based drain blockage detection and flood early warning system for smart cities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aaditya Rai", email = "your.email@example.com"}
]
keywords = ["flood", "drainage", "iot", "smart-city", "machine-learning", "hydrology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
analysis = [
    "rasterio>=1.3.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
]
webviewer = [
    "flask>=3.0.0",
    "folium>=0.15.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/nomadrai/FlowGuard"
Repository = "https://github.com/nomadrai/FlowGuard"
Issues = "https://github.com/nomadrai/FlowGuard/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
